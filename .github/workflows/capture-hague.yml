name: Capture Hague Export walkthrough

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e537-ndh-com-ea34ebce
    paths:
      - .github/workflows/capture-hague.yml
      - scripts/capture-hague.mjs

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0e537-ndh-com-ea34ebce
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture the website
        run: node scripts/capture-hague.mjs 2>&1 | tee capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hague-export-captures
          path: |
            .arena-captures
            capture.log
          retention-days: 3
          if-no-files-found: warn
      - name: Return captures to the session branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .arena-captures capture.log
          git commit -m "chore: return Hague Export captures"
          git push origin HEAD:arena/01a0e537-ndh-com-ea34ebce
